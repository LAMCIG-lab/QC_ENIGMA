[project]
name = "shapeqc"
version = "0.1.0"
description = "ENIGMA subcortical shape QC (thickness, log-Jacobian, curvature)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "LAMCIG lab" }]
dependencies = [
  "numpy>=1.20",
  "pandas>=1.3",
  "scikit-learn==1.3.2",
  "joblib>=1.2",
]

[project.scripts]
qc-report = "shapeqc.cli:report"

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["matplotlib<3.8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
